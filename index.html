<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TRPG 캐릭터 시트</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <body>
    <div class="sheet-container">
        
        <!-- 상단 레이아웃: 초상화와 헤더/기본정보를 가로로 배치 -->
        <div class="top-section">
            
            <!-- 초상화 영역 -->
            <div class="portrait-container">
                <div class="portrait-box">
                    <span class="portrait-placeholder">초상화<br>(이미지 클릭)</span>
                    <input type="file" id="portrait-upload" accept="image/*" style="display: none;">
                    <img id="portrait-preview" src="" alt="캐릭터 초상화" style="display: none;">
                </div>
            </div>

            <!-- 헤더 및 기본 정보 영역 -->
            <div class="header-info-container">
                <header class="sheet-header">
                    <input type="text" class="name-input" placeholder="캐릭터 이름" value="">
                    <input type="text" class="subtitle-input" placeholder="클래스 및 종족" value="">
                </header>
                
                <div class="basic-info">
                    <div class="info-group">
                        <label for="gender">성별</label>
                        <input type="text" id="gender" placeholder="예: 여성, 남성">
                    </div>
                    <div class="info-group">
                        <label for="wealth">재산</label>
                        <div class="wealth-input">
                            <input type="number" id="wealth" placeholder="0">
                            <span>시릿</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 능력치 영역 (최대치 표기 추가) -->
        <div class="stats-container">
            <div class="stat-box">
                <label>근력</label>
                <div class="stat-input-group">
                    <input type="number" min="0" max="20" value="0">
                    <span class="stat-max">/ 20</span>
                </div>
            </div>
            <div class="stat-box">
                <label>민첩</label>
                <div class="stat-input-group">
                    <input type="number" min="0" max="20" value="0">
                    <span class="stat-max">/ 20</span>
                </div>
            </div>
            <div class="stat-box">
                <label>체력</label>
                <div class="stat-input-group">
                    <input type="number" min="0" max="20" value="0">
                    <span class="stat-max">/ 20</span>
                </div>
            </div>
            <div class="stat-box">
                <label>지능</label>
                <div class="stat-input-group">
                    <input type="number" min="0" max="20" value="0">
                    <span class="stat-max">/ 20</span>
                </div>
            </div>
            <div class="stat-box">
                <label>마력</label>
                <div class="stat-input-group">
                    <input type="number" min="0" max="10" value="0">
                    <span class="stat-max">/ 10</span>
                </div>
            </div>
            <div class="stat-box">
                <label>외모</label>
                <div class="stat-input-group">
                    <input type="number" min="0" max="8" value="0">
                    <span class="stat-max">/ 8</span>
                </div>
            </div>
        </div>
        
        <!-- 이 아래로는 기존의 스킬 영역, 인벤토리 영역이 그대로 이어집니다 -->

        <!-- 스킬 영역 -->
        <div class="skills-section">
            <h2 class="section-title">보유 스킬</h2>
            
            <div class="skills-list">
                <!-- 스킬 항목 제목줄 -->
                <div class="skill-header">
                    <div class="col-name">스킬명</div>
                    <div class="col-level">레벨</div>
                    <div class="col-desc">효과 및 설명</div>
                </div>

                <!-- 스킬 입력 칸 (필요한 만큼 복사해서 사용 가능합니다) -->
                <div class="skill-row">
                    <input type="text" class="col-name" placeholder="예: 연속 베기">
                    <input type="number" class="col-level" min="1" max="10" placeholder="1">
                    <input type="text" class="col-desc" placeholder="적을 2회 연속으로 공격합니다.">
                </div>
                <div class="skill-row">
                    <input type="text" class="col-name" placeholder="스킬 이름">
                    <input type="number" class="col-level" min="1" max="10" placeholder="1">
                    <input type="text" class="col-desc" placeholder="스킬 설명을 적으세요">
                </div>
                <div class="skill-row">
                    <input type="text" class="col-name" placeholder="">
                    <input type="number" class="col-level" min="1" max="10" placeholder="">
                    <input type="text" class="col-desc" placeholder="">
                </div>
                <div class="skill-row">
                    <input type="text" class="col-name" placeholder="">
                    <input type="number" class="col-level" min="1" max="10" placeholder="">
                    <input type="text" class="col-desc" placeholder="">
                </div>
            </div>
        </div>
        <!-- 스킬 영역 끝난 후 아래에 추가 -->

        <!-- 인벤토리 (장비 및 소지품) 영역 -->
        <div class="inventory-section">
            <h2 class="section-title">장비 및 소지품</h2>
            
            <!-- 장착 중인 장비 -->
            <div class="equipped-gear">
                <div class="gear-slot">
                    <label>오른손 (주무기)</label>
                    <input type="text" placeholder="예: 낡은 롱소드">
                </div>
                <div class="gear-slot">
                    <label>왼손 (보조/방패)</label>
                    <input type="text" placeholder="예: 나무 방패">
                </div>
                <div class="gear-slot">
                    <label>방어구</label>
                    <input type="text" placeholder="예: 가죽 갑옷">
                </div>
                <div class="gear-slot">
                    <label>장신구</label>
                    <input type="text" placeholder="예: 행운의 부적">
                </div>
            </div>

            <!-- 가방 속 소지품 (리스트) -->
            <h3 class="subsection-title">배낭 (아이템 목록)</h3>
            <div class="inventory-list">
                <!-- 인벤토리 항목 제목줄 -->
                <div class="inventory-header">
                    <div class="col-item-name">아이템명</div>
                    <div class="col-item-qty">수량</div>
                    <div class="col-item-desc">비고 / 무게</div>
                </div>

                <!-- 아이템 입력 칸 (필요한 만큼 복사해서 사용) -->
                <div class="inventory-row">
                    <input type="text" class="col-item-name" placeholder="예: 횃불">
                    <input type="number" class="col-item-qty" min="0" placeholder="3">
                    <input type="text" class="col-item-desc" placeholder="어두운 곳을 밝힘">
                </div>
                <div class="inventory-row">
                    <input type="text" class="col-item-name" placeholder="치유의 물약">
                    <input type="number" class="col-item-qty" min="0" placeholder="1">
                    <input type="text" class="col-item-desc" placeholder="체력 회복">
                </div>
                <div class="inventory-row">
                    <input type="text" class="col-item-name" placeholder="">
                    <input type="number" class="col-item-qty" min="0" placeholder="">
                    <input type="text" class="col-item-desc" placeholder="">
                </div>
                <div class="inventory-row">
                    <input type="text" class="col-item-name" placeholder="">
                    <input type="number" class="col-item-qty" min="0" placeholder="">
                    <input type="text" class="col-item-desc" placeholder="">
                </div>
                <div class="inventory-row">
                    <input type="text" class="col-item-name" placeholder="">
                    <input type="number" class="col-item-qty" min="0" placeholder="">
                    <input type="text" class="col-item-desc" placeholder="">
                </div>
                <div class="inventory-row">
                    <input type="text" class="col-item-name" placeholder="">
                    <input type="number" class="col-item-qty" min="0" placeholder="">
                    <input type="text" class="col-item-desc" placeholder="">
                </div>
                <div class="inventory-row">
                    <input type="text" class="col-item-name" placeholder="">
                    <input type="number" class="col-item-qty" min="0" placeholder="">
                    <input type="text" class="col-item-desc" placeholder="">
                </div>
                <div class="inventory-row">
                    <input type="text" class="col-item-name" placeholder="">
                    <input type="number" class="col-item-qty" min="0" placeholder="">
                    <input type="text" class="col-item-desc" placeholder="">
                </div>
                <div class="inventory-row">
                    <input type="text" class="col-item-name" placeholder="">
                    <input type="number" class="col-item-qty" min="0" placeholder="">
                    <input type="text" class="col-item-desc" placeholder="">
                </div>
                <div class="inventory-row">
                    <input type="text" class="col-item-name" placeholder="">
                    <input type="number" class="col-item-qty" min="0" placeholder="">
                    <input type="text" class="col-item-desc" placeholder="">
                </div>
            </div>
        </div>
    </div>
</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TRPG 캐릭터 시트</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="sheet-container">
        <header class="sheet-header">
            <h1>캐릭터 이름</h1>
            <p class="subtitle">클래스 및 종족</p>
        </header>
        <!-- 상단 헤더 (이름 부분) 아래에 들어갈 내용입니다 -->
        
        <!-- 성별 & 재산 영역 -->
        <div class="basic-info">
            <div class="info-group">
                <label for="gender">성별</label>
                <input type="text" id="gender" placeholder="예: 여성, 남성, 무성">
            </div>
            <div class="info-group">
                <label for="wealth">재산</label>
                <div class="wealth-input">
                    <input type="number" id="wealth" placeholder="0">
                    <span>시릿</span>
                </div>
            </div>
        </div>
<!-- 능력치 영역 끝난 후 아래에 추가 -->

        <!-- 스킬 영역 -->
        <div class="skills-section">
            <h2 class="section-title">보유 스킬</h2>
            
            <div class="skills-list">
                <!-- 스킬 항목 제목줄 -->
                <div class="skill-header">
                    <div class="col-name">스킬명</div>
                    <div class="col-level">레벨</div>
                    <div class="col-desc">효과 및 설명</div>
                </div>

                <!-- 스킬 입력 칸 (필요한 만큼 복사해서 사용 가능합니다) -->
                <div class="skill-row">
                    <input type="text" class="col-name" placeholder="예: 연속 베기">
                    <input type="number" class="col-level" min="1" max="10" placeholder="1">
                    <input type="text" class="col-desc" placeholder="적을 2회 연속으로 공격합니다.">
                </div>
                <div class="skill-row">
                    <input type="text" class="col-name" placeholder="스킬 이름">
                    <input type="number" class="col-level" min="1" max="10" placeholder="1">
                    <input type="text" class="col-desc" placeholder="스킬 설명을 적으세요">
                </div>
                <div class="skill-row">
                    <input type="text" class="col-name" placeholder="">
                    <input type="number" class="col-level" min="1" max="10" placeholder="">
                    <input type="text" class="col-desc" placeholder="">
                </div>
                <div class="skill-row">
                    <input type="text" class="col-name" placeholder="">
                    <input type="number" class="col-level" min="1" max="10" placeholder="">
                    <input type="text" class="col-desc" placeholder="">
                </div>
            </div>
        </div>
        <!-- 능력치 영역 -->
        <div class="stats-container">
            <div class="stat-box">
                <label>근력</label>
                <input type="number" min="0" max="20" value="0">
            </div>
            <div class="stat-box">
                <label>민첩</label>
                <input type="number" min="0" max="20" value="0">
            </div>
            <div class="stat-box">
                <label>체력</label>
                <input type="number" min="0" max="20" value="0">
            </div>
            <div class="stat-box">
                <label>지능</label>
                <input type="number" min="0" max="20" value="0">
            </div>
            <div class="stat-box">
                <label>마력</label>
                <input type="number" min="0" max="20" value="0">
            </div>
        </div>
    </div>
</body>
</html>
